[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stapled"
version = "0.1.0"
description = "Infer latent truth from multi-outlet news articles via statistical inference"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.9.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "matplotlib>=3.5",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.0.292",
]

[project.scripts]
stapled = "stapled.cli:app"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
