name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest -q

      - name: Experiment smoke (E1 + E2 quick)
        run: |
          python -m stapled.experiments e1 --seed 42 --quick --out-dir /tmp/ci_smoke
          python -m stapled.experiments e2 --seed 42 --quick --out-dir /tmp/ci_smoke
          test -f /tmp/ci_smoke/e1_recovery.csv
          test -f /tmp/ci_smoke/e2_syndication.csv
          test -f /tmp/ci_smoke/manifest.json
